name: Update US boards (minute)

# HOW THIS ACHIEVES A ONE-MINUTE CADENCE WITHOUT AN EXTERNAL PINGER.
#
# `schedule` is not a cadence, it is a hint, and that is measured rather than
# assumed. Across these boards: nifty-ema-board asked for 288 runs/day on */5
# and got 5, at 4-6h gaps; nifty-pcr-tracker asked 96/day and got ~2, sitting
# 14.6h stale mid-session; fno-rollover's weekly cron fired ZERO times in its
# life while showing `active`. So a */1 cron here would simply not run, and
# this board proved the point by sitting on a 1,365-minute-old snapshot.
#
# The remedy is a SELF-CHAINING dispatch: the last step of each run dispatches
# the next one. `workflow_dispatch` is one of the two events GITHUB_TOKEN is
# allowed to trigger, so nothing is throttled, and no PAT or third-party
# pinger is involved. Measured cadence on the sibling board: ~57s.
#
# The details below are each load-bearing:
#
#   * `actions: write` - without it the handoff cannot dispatch.
#   * `cancel-in-progress: false` - the group then holds one running plus one
#     pending and rejects further pending dispatches, so if two chains ever
#     start they collapse into one by themselves. With `true` they would keep
#     cancelling each other instead.
#   * handoff on `!cancelled()` - NOT `always()`, which would resurrect a
#     chain that concurrency deliberately collapsed, and NOT `success()`,
#     which would end the whole trading day on one failed Yahoo fetch.
#   * a PHASE GATE - but on the WORK, not on the chain. The chain is perpetual:
#     outside 09:00-16:05 ET it fetches nothing and idles onto the next open.
#     It ended at the close until 2026-10-07, and the morning cron that was
#     supposed to restart it fired 2 times one day and 0 the next against ~60
#     slots, so the board sat on an overnight snapshot through a live session.
#     Ignition by `schedule` is the one part of this design that never worked.
#     The stop condition is now an explicit kill file, `/.chain-off`, which is
#     a switch someone throws rather than one that fails silently.
on:
  schedule:
    # Starters only, never the cadence. Several lines because a single cron
    # demonstrably fires zero times, and both US clock offsets are covered
    # (09:00 ET is 13:00 UTC in EDT, 14:00 UTC in EST). A starter that fires
    # in the wrong phase stops immediately and costs nothing.
    # These are now only a RECOVERY path -- the chain idles through the night
    # instead of ending, so nothing routine depends on them.
    # Measured 2026-10-06: the four starters below fired nowhere near their
    # slots - the first successful schedule run of the day landed at 18:43Z
    # against a 12:55Z slot, so the chain did not start until 14:43 ET and the
    # board missed the first five hours of the session. GitHub simply does not
    # honour these times. The answer is MANY chances rather than well-chosen
    # ones: every 10 minutes across the pre-open and the whole session, so a
    # late or dropped cron costs minutes instead of hours. Each one that fires
    # while a chain is already running is cancelled by the concurrency group
    # at no cost, and each one that fires out of phase stops immediately.
    - cron: '*/10 12-21 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: "Build even outside US market hours"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write          # the handoff dispatches this same workflow

concurrency:
  group: us-board
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75        # covers the longest idle hop (45m) with margin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip            # ~11s of a ~60s job, every single run

      - run: pip install -r requirements.txt

      # Read once, up front, so every later step agrees on the phase even if
      # the run straddles a boundary.
      - name: Work out the market phase
        id: phase
        run: |
          read -r p w < <(python3 -c "import sys; sys.path.insert(0,'.'); \
            import us_market_core as U; print(U.market_phase(), U.chain_wait_seconds())")
          echo "phase=$p" >> "$GITHUB_OUTPUT"
          echo "wait=$w"   >> "$GITHUB_OUTPUT"
          echo "US market phase: $p (next handoff waits ${w}s)"

      - name: Fetch the snapshot
        if: steps.phase.outputs.phase != 'stop'
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 scripts/fetch_data.py --force
          else
            python3 scripts/fetch_data.py
          fi

      # No separate spot step: fetch_data.py writes data/spot.json from the
      # sweep it has already done. refresh_spot.py was re-fetching the same
      # 614 symbols through yfinance at 41s against that sweep's 12s - more
      # than half this job's runtime for prices already in memory, and it let
      # the two boards disagree about the same name at the same moment.

      # Open interest only settles overnight, but volume moves all session and
      # the whole chain is one request per underlying.
      - name: Refresh the put-call ratios
        if: steps.phase.outputs.phase != 'stop'
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 scripts/fetch_pcr.py --force
          else
            python3 scripts/fetch_pcr.py
          fi
        continue-on-error: true

      - name: Commit if anything changed
        if: steps.phase.outputs.phase != 'stop'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- board_data.json data/spot.json data/pcr.json; then
            echo "nothing changed - nothing to commit"
            exit 0
          fi
          git add board_data.json data/spot.json data/pcr.json
          git commit -m "US boards: $(date -u +%H:%M) UTC snapshot"
          # The daily job writes to this branch too, and so does the next run
          # in the chain, so a plain rebase hits a CONFLICT on these files -
          # which killed a run on 2026-10-06. A conflict between two generated
          # snapshots is meaningless: this run's data is strictly newer, so it
          # always wins. `-X theirs` during a rebase favours the commit being
          # replayed, i.e. ours. Retried, because the branch can move again
          # between the fetch and the push.
          for attempt in 1 2 3; do
            git fetch -q origin main || true
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "rebase failed on attempt $attempt"
              sleep 2
              continue
            fi
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push rejected on attempt $attempt; refetching"
            sleep 2
          done
          echo "::warning::could not push this snapshot; the next run will carry it"
          exit 0

      # ── the daily rebuild rides on THIS cadence, not on `schedule` ──
      # Idempotent by construction: it asks whether the daily workflow has run
      # since today's post-close slot and dispatches only if it has not, so
      # every later run in the chain finds it and does nothing. It must never
      # fail the price job - a broken kicker must not stop prices updating.
      - name: Kick the daily rebuild once the US cash market has closed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          slot=$(python3 -c "import sys; sys.path.insert(0,'.'); \
            import us_market_core as U; n=U.now_et(); \
            print('yes' if n.weekday()<5 and n.hour>=16 else 'no')")
          if [ "$slot" != "yes" ]; then echo "not past the close yet"; exit 0; fi
          cutoff="$(date -u +%Y-%m-%d)T00:00:00Z"
          n=$(gh run list --workflow=rrg.yml --limit 40 --json createdAt \
                -q "[.[] | select(.createdAt >= \"$cutoff\")] | length") || n=""
          if [ -z "$n" ]; then echo "could not read run history, not dispatching"; exit 0; fi
          if [ "$n" -eq 0 ]; then
            gh workflow run rrg.yml && echo "dispatched the daily rebuild"
          else
            echo "daily rebuild already ran today ($n run(s))"
          fi

      # ── hand off to the next run ──────────────────────────────────────
      # LAST step, and the only thing that produces the cadence. See the
      # header for why this is `!cancelled()` rather than always()/success().
      # Outside the session there is nothing to fetch but the chain must still
      # survive to the next open, so it waits here rather than ending. Long hops
      # onto the 09:00 ET boundary, not a tick through the night.
      - name: Idle until the next phase
        if: ${{ !cancelled() && steps.phase.outputs.wait != '0' }}
        run: sleep ${{ steps.phase.outputs.wait }}

      - name: Hand off to the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # THE CHAIN NO LONGER STOPS. It used to end at `stop` and wait for a
          # morning cron, and the cron did not come: 2 firings on 2026-10-06 and
          # 0 on 2026-10-07 against ~60 slots a day, so the board sat on an
          # overnight snapshot through a live session. The stop condition that a
          # self-chaining workflow needs is now the KILL FILE below rather than
          # the clock -- an explicit switch instead of an ignition that fails.
          if [ -f .chain-off ]; then
            echo "/.chain-off present — chain ends here by request"
            exit 0
          fi
          # RETRY. On 2026-10-06 the chain died at 15:47 ET - thirteen minutes
          # before the close - because this call returned a transient
          # "HTTP 500 ... /actions/workflows/.../dispatches". A single `||`
          # fallback swallowed it, the step reported success, and the board
          # stopped updating for the rest of the session. One server blip must
          # not cost a trading day, so the dispatch is retried with backoff and
          # the step FAILS loudly if every attempt is refused.
          for attempt in 1 2 3 4 5; do
            if gh workflow run update.yml; then
              echo "dispatched the next run (attempt $attempt)"
              exit 0
            fi
            echo "dispatch attempt $attempt failed; retrying"
            sleep $((attempt * 3))
          done
          echo "::error::handoff failed 5 times - the chain has stopped and only a cron can restart it"
          exit 1
