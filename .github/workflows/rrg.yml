name: Rebuild US boards (daily)

# WHY workflow_dispatch AND NOT schedule.
# GitHub throttles scheduled workflows hard: on the sibling Indian boards a
# `schedule` asking for a high cadence delivered ~2 runs a day at erratic
# times, once 7h30m late. The reliable path, proven there, is an external
# pinger (cron-job.org) calling the workflow_dispatch REST API - a run
# triggered that way landed 33 seconds past its slot.
#
# The job is idempotent by design: build_rrg.py --if-stale re-checks staleness
# itself against the last 17:00 ET boundary, so a duplicate or late ping is a
# no-op rather than a wasted 615-symbol fetch.
on:
  # REDUNDANT CRONS, not one. A single `schedule` line fires unreliably and
  # sometimes not at all (fno-rollover's weekly cron fired zero times in its
  # life while showing `active`), so the daily rebuild gets several chances
  # across the post-close window, in both US clock offsets. This is only safe
  # because duplicates are no-ops: build_rrg.py --if-stale and
  # daily_levels.py --if-stale both re-check against the last close and exit.
  #
  # The minute chain ALSO kicks this job once after the close, which is the
  # path that actually works; these are the backstop for a day the chain never
  # started.
  schedule:
    - cron: '30 21 * * 1-5'     # 17:30 ET (EDT) / 16:30 ET (EST)
    - cron: '30 22 * * 1-5'     # 18:30 / 17:30 ET
    - cron: '30 1 * * 2-6'      # well after the close, both offsets
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the data is current for the latest close"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: us-rrg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # nifty-heatmap-core carries the RRG maths

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build rrg_data.json
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 scripts/build_rrg.py --force
          else
            python3 scripts/build_rrg.py --if-stale
          fi

      # Levels, 52-week extremes and the PnF grids are daily values for the
      # same reason the RRG is, so they are rebuilt in the same post-close job.
      # Not gated on --if-stale: unlike the RRG this is cheap to repeat and
      # yfinance occasionally drops a symbol, so a second run is a repair.
      - name: Rebuild the EMA board's levels and PnF
        run: python3 scripts/daily_levels.py --if-stale
        continue-on-error: true

      - name: Commit if the data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- rrg_data.json data/levels.json data/pnf.json; then
            echo "nothing changed - nothing to commit"
            exit 0
          fi
          git add rrg_data.json data/levels.json data/pnf.json
          git commit -m "US RRG: rebuild for $(date -u +%Y-%m-%d)"
          git push
